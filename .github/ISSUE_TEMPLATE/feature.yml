name: Feature request
description: Something the agent should do that it does not do yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to get done?
      description: Describe the situation in your search, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This would need the agent to pay for something, sign something, or get past a captcha (these stay out of scope)
