version: 2
updates:
  # One grouped pull request a week for npm, so updates arrive together and CI
  # runs once for them. Security updates still arrive as soon as they exist.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    # The project supports Node 22.12 and newer. These majors need a newer Node.
    ignore:
      - dependency-name: '@types/node'
        versions: ['>=23']
      - dependency-name: 'jsdom'
        versions: ['>=27']
      # typescript-eslint 8 supports TypeScript below 6.1. Lift this once it supports 7.
      - dependency-name: 'typescript'
        versions: ['>=6.1']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
